spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://app-db:5432/agent
    username: agent
    password: ${AGENT_DB_PASS}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  main:
    banner-mode: "off"

  rabbitmq:
    host: rabbitmq

keycloak:
  base-url: ${KC_BASE_URL:http://keycloak:8080}
  realm: ${KC_REALM:agent}
  client-id: ${KC_CLIENT_ID:agent-backend}
  client-secret: ${KC_CLIENT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.amqp: INFO
    com.agent.backend: DEBUG
    com.agent.llm: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

server:
  port: 8080

security:
  tokens:
    encryption:
      key: ${TOKEN_ENCRYPTION_KEY}
      key-id: ${TOKEN_ENCRYPTION_KEY_ID:default}
    token-hash-secret: ${TOKEN_HASH_SECRET}

deposit:
  wallet:
    address: ${DEPOSIT_WALLET_ADDRESS}
  poll-interval-ms: ${DEPOSIT_POLL_INTERVAL_MS:8000}
  expiry:
    hours: 24

email:
  provider: resend
  resend:
    api-key: ${RESEND_API_KEY}
    api-url: https://api.resend.com
    from-email: ${EMAIL_FROM:noreply@yourdomain.com}
    from-name: ${EMAIL_FROM_NAME:Esprito AI}
  verification:
    token-ttl-hours: 24
    base-url: ${APP_BASE_URL:http://localhost:80}
  rate-limit:
    max-requests-per-hour: 5
    max-resends-per-token: 3
