<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{subject}} - Esprito AI</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        body {
            margin: 0 !important;
            padding: 0 !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        img {
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
        }
        a { text-decoration: none; }

        .preheader {
            display: none !important;
            visibility: hidden;
            mso-hide: all;
            font-size: 1px;
            line-height: 1px;
            max-height: 0;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
        }

        @media (prefers-color-scheme: dark) {
            .bg-light   { background-color: #1a1a1a !important; }
            .bg-white   { background-color: #2d2d2d !important; }
            .text-dark  { color: #f1f5f9 !important; }
            .text-gray  { color: #cbd5e1 !important; }
            .text-muted { color: #94a3b8 !important; }
            .footer-bg  { background-color: #1e1e1e !important; }
            .border-gray { border-color: #334155 !important; }
        }

        @media only screen and (max-width: 600px) {
            .wrapper  { width: 100% !important; }
            .container { width: 100% !important; max-width: 100% !important; }
            .mobile-padding { padding: 20px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">

    <div class="preheader">{{subject}}</div>

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="bg-light" style="background-color: #f5f7fa;">
        <tr>
            <td align="center" style="padding: 20px 10px;">

                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" class="container bg-white" style="max-width: 600px; background-color: #ffffff; border-radius: 16px;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); padding: 40px 32px; border-radius: 16px 16px 0 0;">
                            <img src="{{baseUrl}}/email/logo.png"
                                 width="64" height="64"
                                 alt="Esprito AI"
                                 style="display: block; width: 64px; height: 64px; margin: 0 auto 16px;">
                            <p style="margin: 0; color: #ffffff; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85;">Esprito AI Newsletter</p>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td class="mobile-padding" style="padding: 40px 40px 32px;">
                            <div class="text-dark" style="color: #1a1a1a; font-size: 16px; line-height: 1.7;">
                                {{content}}
                            </div>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="padding: 0 40px 32px;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td style="border-top: 1px solid #e2e8f0;"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="mobile-padding footer-bg border-gray" style="padding: 28px 40px; background-color: #f8fafc; border-top: 1px solid #e2e8f0; border-radius: 0 0 16px 16px;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td align="center" class="text-muted" style="color: #64748b; font-size: 13px; font-weight: 600; padding-bottom: 6px;">
                                        Esprito AI
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" class="text-muted" style="color: #94a3b8; font-size: 12px; line-height: 1.5; padding-bottom: 12px;">
                                        © 2026 Esprito Tech QFZ LLC. All rights reserved.
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="font-size: 12px;">
                                        <a href="{{unsubscribeLink}}" style="color: #94a3b8; text-decoration: underline;">
                                            Unsubscribe from this newsletter
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
