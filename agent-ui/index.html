<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trade crypto on TON DEXes effortlessly with AI-powered chat interface. No complex protocols, just simple conversations." />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Esprito AI - Trade Crypto with AI on TON Blockchain" />
    <meta property="og:description" content="Trade crypto on TON DEXes effortlessly with AI-powered chat interface. No complex protocols, just simple conversations." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Esprito AI - Trade Crypto with AI on TON Blockchain" />
    <meta name="twitter:description" content="Trade crypto on TON DEXes effortlessly with AI-powered chat interface. No complex protocols, just simple conversations." />
    <meta name="twitter:image" content="/favicon.svg" />

    <title>Esprito AI - Trade Crypto with AI on TON Blockchain</title>
    <!-- Inline theme init: set class on <html> synchronously to avoid flash-of-unstyled-theme -->
    <script>
      (function(){
        try {
          const K = 'app-theme'
          const saved = localStorage.getItem(K)
          const t = (saved === 'light' || saved === 'dark') ? saved : 'dark'
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
