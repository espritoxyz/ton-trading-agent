<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trade crypto on TON DEXes effortlessly with AI-powered chat interface. No complex protocols, just simple conversations." />
    <title>Esprito AI - Trade Crypto with AI on TON Blockchain</title>
    <!-- Inline theme init: set class on <html> synchronously to avoid flash-of-unstyled-theme -->
    <script>
      (function(){
        try {
          const K = 'app-theme'
          const saved = localStorage.getItem(K)
          const t = (saved === 'light' || saved === 'dark') ? saved : 'dark'
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
