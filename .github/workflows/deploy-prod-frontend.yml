name: Deploy PROD Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "agent-ui/**"

concurrency:
  group: esprito-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            /opt/esprito/deploy-prod-frontend.sh

      - name: Diagnostics (only if failed)
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set +e
            ls -la /var/www/esprito/prod/ | head -n 20 || true
            tail -n 50 /var/log/nginx/error.log || true
